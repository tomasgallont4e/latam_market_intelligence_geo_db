<div class="map-page">
  <div class="map-layout">
    <aside class="map-panel" aria-label="Controles del mapa">
      <div class="panel-brand">
        <span class="t4e-word">think<b>4</b>ever</span>
        <span class="pb-sub">Mapa de indicadores LATAM</span>
      </div>

      <section class="panel-section" aria-labelledby="sec-country">
        <div class="panel-label"><label class="overline" id="sec-country" for="map_country_select">País</label></div>
        <select id="map_country_select" aria-describedby="country-note">
          <option value="CO">Colombia</option>
          <option value="PE">Perú</option>
        </select>
        <p class="persona-note" id="country-note">Cambie de país sin salir del mapa.</p>
      </section>

      <section class="panel-section" aria-labelledby="sec-capa">
        <div class="panel-label">
          <span class="overline" id="sec-capa">Capa</span>
          <span class="count" id="layer-count"></span>
        </div>
        <div id="map_layer_select">
          <div class="layer-group" role="radiogroup" aria-labelledby="lg-dept" data-group-list="dept"></div>
          <div class="layer-group" role="radiogroup" aria-labelledby="lg-city" data-group-list="city"></div>
          <div class="layer-group" role="radiogroup" aria-labelledby="lg-bog" data-group-list="bog"></div>
        </div>
      </section>

      <section class="panel-section" aria-labelledby="sec-persona">
        <div class="panel-label">
          <label class="overline" id="sec-persona" for="map_persona_filter">Filtro por persona</label>
          <span class="count raw-name">fact_persona_profile.persona</span>
        </div>
        <select id="map_persona_filter" aria-describedby="persona-note">
          <option value="">Todas</option>
        </select>
        <p class="persona-note" id="persona-note" aria-live="polite"></p>
      </section>

      <section class="panel-section" id="map_legend" aria-labelledby="sec-leyenda">
        <div class="panel-label">
          <span class="overline" id="sec-leyenda">Leyenda</span>
        </div>
        <div id="map_legend_body" aria-live="polite"></div>
      </section>

      <section class="panel-section" aria-labelledby="sec-ficha">
        <div class="panel-label">
          <span class="overline" id="sec-ficha">Ficha del lugar</span>
          <span class="count" id="jump-count"></span>
        </div>
        <div class="jump-row">
          <label for="place-jump" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Ir a un lugar</label>
          <select id="place-jump" aria-label="Ir a un lugar"></select>
        </div>
        <div class="place-card" id="map_place_info" aria-live="polite">
          <div class="place-empty"><i class="fa-regular fa-hand-pointer" aria-hidden="true"></i>Haga clic en un lugar del mapa</div>
        </div>
      </section>

      <div class="map-foot" id="map_source_footer">Todas las cifras son agregados; no hay datos personales.</div>
    </aside>

    <section class="map-canvas" id="map_leaflet" aria-label="Mapa Leaflet">
      <div id="map" role="region" aria-label="Mapa interactivo de indicadores LATAM"></div>
      <div class="map-overlay" id="map-overlay" aria-hidden="true"></div>
      <div class="map-geo-note" id="map-geo-note" hidden></div>
      <div class="map-loading" id="map-loading"><span><i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>Cargando mapa…</span></div>
    </section>
  </div>
</div>
