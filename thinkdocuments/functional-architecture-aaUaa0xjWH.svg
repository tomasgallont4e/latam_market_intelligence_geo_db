    <circle cx="15" cy="15" r="10" fill="#0d9488"/>
    <text x="15" y="19" font-family="Georgia, serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
    <g transform="translate(72,6) scale(0.95)" stroke="#0d9488" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="5.3" fill="none"/><path d="M9,5 L7.4,7.4 L5,9 L6.6,6.6 Z" fill="#0d9488" stroke="none"/></g>
