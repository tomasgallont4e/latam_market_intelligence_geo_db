<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470">
  <defs>
    <linearGradient id="accGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    <linearGradient id="expGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.10"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e5e7eb" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="waveIconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="30%" style="stop-color:#0d9488"/>
      <stop offset="55%" style="stop-color:#0891b2"/>
      <stop offset="80%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="900" height="470" fill="#f8fafc"/>
  <rect width="900" height="470" fill="url(#grid)"/>

  <g fill="url(#waveIconGrad)">
    <rect x="30" y="30" width="5" height="20" rx="2"/>
    <rect x="40" y="20" width="5" height="40" rx="2"/>
    <rect x="50" y="34" width="5" height="12" rx="2"/>
    <rect x="60" y="14" width="5" height="52" rx="2"/>
    <rect x="70" y="26" width="5" height="28" rx="2"/>
    <rect x="80" y="36" width="5" height="8" rx="2"/>
    <rect x="815" y="36" width="5" height="8" rx="2"/>
    <rect x="825" y="26" width="5" height="28" rx="2"/>
    <rect x="835" y="14" width="5" height="52" rx="2"/>
    <rect x="845" y="34" width="5" height="12" rx="2"/>
    <rect x="855" y="20" width="5" height="40" rx="2"/>
