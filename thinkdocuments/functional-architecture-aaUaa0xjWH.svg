    <circle cx="15" cy="15" r="10" fill="#0d9488"/>
    <text x="15" y="19" font-family="Georgia, serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
    <g transform="translate(72,6) scale(0.95)" stroke="#0d9488" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="2.6" height="5.5" rx="0.8" fill="none"/><rect x="6" y="4" width="2.6" height="8.5" rx="0.8" fill="none"/><rect x="9.5" y="1.8" width="2.6" height="10.7" rx="0.8" fill="none"/></g>
    <text x="50" y="40" font-family="Georgia, serif" font-size="9" fill="#115e59" text-anchor="middle" font-weight="bold">Totales</text>
    <text x="50" y="58" font-family="monospace" font-size="7" fill="#0d9488" text-anchor="middle">Esperado vs real</text>
