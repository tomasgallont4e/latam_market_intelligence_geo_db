    <g transform="translate(12, 10)" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="2.6" height="5.5" rx="0.8" fill="none"/><rect x="6" y="4" width="2.6" height="8.5" rx="0.8" fill="none"/><rect x="9.5" y="1.8" width="2.6" height="10.7" rx="0.8" fill="none"/></g>
